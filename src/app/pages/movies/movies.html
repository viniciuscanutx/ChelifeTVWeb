<main class="catalog-page animate-page-enter">
  <app-filter-bar
    title="Filmes"
    [count]="filteredMovies().length"
    countLabel="títulos"
    [options]="categoryOptions()"
    [(selected)]="selectedCategory"
    allLabel="Todos os gêneros"
    [searchable]="true"
    [(searchTerm)]="searchTerm"
    searchPlaceholder="Buscar filme..."
    [sortOptions]="sortOptions"
    [(sortValue)]="sortBy"
  />

  <!-- Content Grid -->
  @if (loading()) {
    <div class="page-loading-wrapper">
      <div class="spinner-purple"></div>
      <p>Carregando filmes...</p>
    </div>
  }
  @else if (filteredMovies().length === 0) {
    <div class="catalog-state">
      Nenhum filme encontrado.
    </div>
  }
  @else {
    @for (group of categoryGroups(); track group.category) {
      <app-media-carousel [title]="capitalizeFirstLetter(group.category)" icon="bi-film" [items]="group.items" />
    }
  }
</main>
