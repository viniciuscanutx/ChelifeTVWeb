<main class="catalog-page animate-page-enter">
  <app-filter-bar
    title="Séries"
    [count]="filteredSeries().length"
    countLabel="títulos"
    [options]="categoryOptions()"
    [(selected)]="selectedCategory"
    allLabel="Todos os gêneros"
    [searchable]="true"
    [(searchTerm)]="searchTerm"
    searchPlaceholder="Buscar série..."
    [sortOptions]="sortOptions"
    [(sortValue)]="sortBy"
  />

  <!-- Content Grid -->
  @if (loading()) {
    <div class="page-loading-wrapper">
      <div class="spinner-purple"></div>
      <p>Carregando séries...</p>
    </div>
  }
  @else if (filteredSeries().length === 0) {
    <div class="catalog-state">
      Nenhuma série encontrada.
    </div>
  }
  @else {
    @for (group of categoryGroups(); track group.category) {
      <app-media-carousel [title]="capitalizeFirstLetter(group.category)" icon="bi-tv" [items]="group.items" />
    }
  }
</main>
